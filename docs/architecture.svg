<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Smart Edge Gateway architecture</title>
  <desc id="desc">OpenAI and Anthropic clients enter the Cloudflare Worker gateway, which authenticates and normalizes requests before routing through the Primary pool and optional two-level Fallback chain.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafb"/>
      <stop offset="1" stop-color="#eef3f5"/>
    </linearGradient>
    <linearGradient id="gateway" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#48636f"/>
      <stop offset="1" stop-color="#2d424c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#111827" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#48636f"/>
    </marker>
    <style>
      .title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111827}
      .subtitle{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#66717c}
      .box-title{font:700 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111827}
      .box-title-light{font:700 21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}
      .box-text{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#66717c}
      .box-text-light{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#dce6ea}
      .chip{font:650 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#3e5965}
      .arrow-label{font:650 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#48636f}
    </style>
  </defs>

  <rect width="1400" height="760" rx="28" fill="url(#bg)"/>
  <text x="70" y="72" class="title">Smart Edge Gateway</text>
  <text x="70" y="104" class="subtitle">OpenAI / Anthropic dual-protocol routing on Cloudflare Workers</text>

  <g filter="url(#shadow)">
    <rect x="70" y="185" width="250" height="190" rx="20" fill="#fff" stroke="#dfe6e9"/>
    <text x="100" y="230" class="box-title">Clients</text>
    <text x="100" y="264" class="box-text">OpenAI Chat Completions</text>
    <text x="100" y="292" class="box-text">Anthropic Messages</text>
    <text x="100" y="320" class="box-text">Claude Code</text>
    <rect x="100" y="338" width="134" height="24" rx="12" fill="#edf3f5"/>
    <text x="117" y="355" class="chip">Gateway access key</text>
  </g>

  <path d="M320 280 H420" stroke="#48636f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="345" y="262" class="arrow-label">HTTPS</text>

  <g filter="url(#shadow)">
    <rect x="430" y="155" width="370" height="250" rx="24" fill="url(#gateway)"/>
    <text x="470" y="207" class="box-title-light">Cloudflare Worker Gateway</text>
    <text x="470" y="243" class="box-text-light">Authentication · CORS · request limits</text>
    <text x="470" y="273" class="box-text-light">Protocol conversion · model mapping</text>
    <text x="470" y="303" class="box-text-light">Retries · streaming · tool calls</text>
    <text x="470" y="333" class="box-text-light">Health scoring · cooldown · concurrency</text>
    <rect x="470" y="355" width="82" height="26" rx="13" fill="#fff" fill-opacity="0.12"/>
    <text x="488" y="373" class="chip" fill="#fff">/version</text>
    <rect x="560" y="355" width="82" height="26" rx="13" fill="#fff" fill-opacity="0.12"/>
    <text x="579" y="373" class="chip" fill="#fff">/health</text>
    <rect x="650" y="355" width="92" height="26" rx="13" fill="#fff" fill-opacity="0.12"/>
    <text x="668" y="373" class="chip" fill="#fff">/metrics</text>
  </g>

  <path d="M800 250 H895" stroke="#48636f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="820" y="232" class="arrow-label">normal route</text>

  <g filter="url(#shadow)">
    <rect x="910" y="150" width="420" height="210" rx="22" fill="#fff" stroke="#dfe6e9"/>
    <text x="950" y="198" class="box-title">Primary endpoint pool</text>
    <text x="950" y="232" class="box-text">Endpoint rotation and bounded retries</text>
    <text x="950" y="260" class="box-text">Health score · request window · concurrency</text>
    <text x="950" y="288" class="box-text">Per-host model mapping and invoke URL</text>
    <rect x="950" y="313" width="104" height="25" rx="12" fill="#edf3f5"/>
    <text x="972" y="330" class="chip">Primary A</text>
    <rect x="1064" y="313" width="104" height="25" rx="12" fill="#edf3f5"/>
    <text x="1086" y="330" class="chip">Primary B</text>
    <rect x="1178" y="313" width="108" height="25" rx="12" fill="#edf3f5"/>
    <text x="1200" y="330" class="chip">Primary N</text>
  </g>

  <path d="M1120 360 V445" stroke="#48636f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="1140" y="413" class="arrow-label">all eligible attempts failed</text>

  <g filter="url(#shadow)">
    <rect x="910" y="460" width="195" height="170" rx="20" fill="#fff" stroke="#dfe6e9"/>
    <text x="940" y="505" class="box-title">Fallback 1</text>
    <text x="940" y="538" class="box-text">Primary fallback model</text>
    <text x="940" y="566" class="box-text">Independent URL / token</text>
    <rect x="940" y="588" width="112" height="24" rx="12" fill="#edf3f5"/>
    <text x="959" y="605" class="chip">only on failure</text>
  </g>

  <path d="M1105 545 H1150" stroke="#48636f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="1116" y="528" class="arrow-label">failed</text>

  <g filter="url(#shadow)">
    <rect x="1165" y="460" width="165" height="170" rx="20" fill="#fff" stroke="#dfe6e9"/>
    <text x="1194" y="505" class="box-title">Fallback 2</text>
    <text x="1194" y="538" class="box-text">Optional model</text>
    <text x="1194" y="566" class="box-text">Default: disabled</text>
    <rect x="1194" y="588" width="90" height="24" rx="12" fill="#edf3f5"/>
    <text x="1216" y="605" class="chip">off switch</text>
  </g>

  <g>
    <rect x="70" y="470" width="730" height="160" rx="20" fill="#fff" stroke="#dfe6e9"/>
    <text x="105" y="515" class="box-title">Runtime boundaries</text>
    <text x="105" y="551" class="box-text">Health, concurrency, window counters and cooldowns are local to the current isolate.</text>
    <text x="105" y="581" class="box-text">/health and /metrics are diagnostics, not globally aggregated billing or daily totals.</text>
    <text x="105" y="611" class="box-text">Optional Analytics Engine events can be enabled for cross-isolate trend analysis.</text>
  </g>

  <text x="70" y="706" class="subtitle">Primary is used for normal traffic. Fallback is activated only after Primary exhaustion.</text>
</svg>

