name: CI

# Two-tier CI:
#   verify (required): syntax + config + unit/reliability + protocol contract + docs + secret scan
#   verify:full:      everything in verify + scheduler-stability + integration + stress + codex/claude contract
#
# verify:full runs on push to main, on nightly, and via manual workflow_dispatch.
# verify runs on every push and PR — it is the merge gate.
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 3 * * *' # nightly full CI at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required CI — every PR must pass this. Fast feedback loop.
  # Skips scheduler-stability / integration / stress / benchmark.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify (required)
        run: npm run verify

      - name: Dry-run Worker bundle
        run: npm run check:deploy

  # Full CI — push to main, nightly, or manual trigger. Includes the slow stuff.
  verify-full:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify (full)
        run: npm run verify:full
