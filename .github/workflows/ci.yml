name: CI

# CI policy:
#   validate-merge (required): complete correctness gate + static/repository checks
#   validate-deploy:           repeats the same correctness gate before production deployment
#
# Scheduler stability, integration, reliability/fault injection, and Codex/Claude
# compatibility all run before merge. A correctness test must not first execute
# only after main has already advanced.
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 3 * * *' # nightly full CI at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required CI — every PR must pass the complete correctness gate.
  validate-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate (merge)
        run: npm run validate:merge

      - name: Dry-run Worker bundle
        run: npm run check:deploy

  # Production/nightly revalidation. Kept as a separate status because deployment
  # governance consumes it, but it must not contain correctness coverage absent
  # from validate-merge.
  validate-deploy:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate (deploy)
        run: npm run validate:deploy
