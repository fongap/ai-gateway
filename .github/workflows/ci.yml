name: CI

# Two-tier CI:
#   validate-merge (required): all deterministic correctness tests + static/repository checks
#   validate-deploy:           validate-merge coverage + stress/reliability load tests
#
# The PR gate intentionally includes scheduler stability, integration, and
# Codex/Claude compatibility so a correctness regression cannot first appear
# only after merge. Stress remains in the post-merge/nightly deploy gate.
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 3 * * *' # nightly full CI at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required CI — every PR must pass the complete deterministic correctness gate.
  validate-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate (merge)
        run: npm run validate:merge

      - name: Dry-run Worker bundle
        run: npm run check:deploy

  # Full CI — push to main, nightly, or manual trigger. Adds stress coverage.
  validate-deploy:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate (deploy)
        run: npm run validate:deploy
