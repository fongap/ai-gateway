name: CI

# Two-tier CI:
#   validate-merge (required): syntax + config + unit tests + protocol contract + docs + secret scan
#   validate-deploy:           everything in validate-merge + scheduler-stability + integration + stress + codex/claude contract
#
# validate-deploy runs on push to main, on nightly, and via manual workflow_dispatch.
# validate-merge runs on every push and PR — it is the merge gate.
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 3 * * *' # nightly full CI at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required CI — every PR must pass this. Fast feedback loop.
  # Skips scheduler-stability / integration / stress / benchmark.
  validate-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate (merge)
        run: npm run validate:merge

      - name: Dry-run Worker bundle
        run: npm run check:deploy

  # Full CI — push to main, nightly, or manual trigger. Includes the slow stuff.
  validate-deploy:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate (deploy)
        run: npm run validate:deploy
