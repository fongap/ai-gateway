name: Apply Tier1 Smooth Admission Patch

on:
  push:
    branches:
      - reliability/tier1-smooth-admission

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/tier1-smooth-admission
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply bounded v1.3.1 reliability patch
        run: python3 scripts/apply-tier1-smooth-admission.py

      - name: Install
        run: npm ci

      - name: Validate full deploy gate
        run: npm run validate:deploy

      - name: Commit validated patch
        shell: bash
        run: |
          rm .github/workflows/apply-tier1-smooth-admission.yml
          rm scripts/apply-tier1-smooth-admission.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: smooth Tier1 RPM admission and 429 recovery'
          git push origin HEAD:reliability/tier1-smooth-admission
