name: Deploy

# Production deployment is driven by successful CI on main. D1 migrations run
# before Worker deploy so new code never starts against an older schema.
# GitHub Actions cannot enumerate Secret values dynamically, so tier-scoped
# credential shards are explicitly injected through the fixed 01..10 range.
# Config and credential suffixes are independent; runtime binding is Tier + node id.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  # The gate validates the workflow_run source/conclusion before any deploy is
  # allowed, preventing fork heads and non-push CI runs from reaching production.
  gate:
    if: github.repository == 'fongap/ai-gateway' || vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - name: Checkout triggering commit
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Decide deploy eligibility
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          THIS_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/deploy-gate-decision.mjs

  # Manual deploys run the full validation suite here because they do not have
  # a completed main-push CI run to reuse.
  manual-validate:
    needs: gate
    if: needs.gate.outputs.deploy == 'true' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout triggering commit
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - name: Checkout (manual dispatch)
        if: github.event_name != 'workflow_run'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate (deploy suite — single entry point)
        run: npm run validate:deploy

      - name: Dry-run Worker bundle
        run: npm run check:deploy

  deploy:
    needs: [gate, manual-validate]
    # `always()` is required because automatic workflow_run deploys skip
    # manual-validate; without a status-check function GitHub would also skip
    # this dependent job. The explicit guards still require gate approval and,
    # on manual dispatch, successful validation.
    if: always() && needs.gate.outputs.deploy == 'true' && (needs.manual-validate.result == 'success' || needs.manual-validate.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TOKEN_STATS_D1_ID: ${{ vars.TOKEN_STATS_D1_ID }}
      TIER1_AFFINITY_KV_ID: ${{ vars.TIER1_AFFINITY_KV_ID }}
      GATEWAY_PUBLIC_BASE_URL: ${{ vars.GATEWAY_PUBLIC_BASE_URL }}
      MODELS_CONFIG: ${{ vars.MODELS_CONFIG }}
      POLICIES_CONFIG: ${{ vars.POLICIES_CONFIG }}
      RATE_LIMIT_COOLDOWN_MS: ${{ vars.RATE_LIMIT_COOLDOWN_MS }}
      FIRST_EVENT_TIMEOUT_MS: ${{ vars.FIRST_EVENT_TIMEOUT_MS }}
      STREAM_IDLE_TIMEOUT_MS: ${{ vars.STREAM_IDLE_TIMEOUT_MS }}
      AUTH_FAIL_COOLDOWN_MS: ${{ vars.AUTH_FAIL_COOLDOWN_MS }}
      MAX_BODY_BYTES: ${{ vars.MAX_BODY_BYTES }}
      FAILOVER_BUDGET_MS: ${{ vars.FAILOVER_BUDGET_MS }}
      UPSTREAM_HEADERS_TIMEOUT_MS: ${{ vars.UPSTREAM_HEADERS_TIMEOUT_MS }}
      HEDGE_DELAY_MS: ${{ vars.HEDGE_DELAY_MS }}
      MAX_HEDGES_PER_REQUEST: ${{ vars.MAX_HEDGES_PER_REQUEST }}
      GATEWAY_KEY_RPM: ${{ vars.GATEWAY_KEY_RPM }}
      ALLOWED_ORIGIN: ${{ vars.ALLOWED_ORIGIN }}
      STREAM_INCLUDE_USAGE: ${{ vars.STREAM_INCLUDE_USAGE }}
      STREAM_USAGE_INCLUDE_OFF_PROVIDERS: ${{ vars.STREAM_USAGE_INCLUDE_OFF_PROVIDERS }}
      EXPOSE_UPSTREAM_INFO: ${{ vars.EXPOSE_UPSTREAM_INFO }}
      LOG_LEVEL: ${{ vars.LOG_LEVEL }}
      FAKE_STREAM_PROTECTION: ${{ vars.FAKE_STREAM_PROTECTION }}
      ALLOW_INSECURE_HTTP_UPSTREAM: ${{ vars.ALLOW_INSECURE_HTTP_UPSTREAM }}
      ANTHROPIC_COUNT_TOKENS_MODE: ${{ vars.ANTHROPIC_COUNT_TOKENS_MODE }}
      PROTOCOL_FALLBACKS: ${{ vars.PROTOCOL_FALLBACKS }}
      TIER1_NODES_CONFIG_01: ${{ vars.TIER1_NODES_CONFIG_01 }}
      TIER1_NODES_CONFIG_02: ${{ vars.TIER1_NODES_CONFIG_02 }}
      TIER1_NODES_CONFIG_03: ${{ vars.TIER1_NODES_CONFIG_03 }}
      TIER1_NODES_CONFIG_04: ${{ vars.TIER1_NODES_CONFIG_04 }}
      TIER1_NODES_CONFIG_05: ${{ vars.TIER1_NODES_CONFIG_05 }}
      TIER1_NODES_CONFIG_06: ${{ vars.TIER1_NODES_CONFIG_06 }}
      TIER1_NODES_CONFIG_07: ${{ vars.TIER1_NODES_CONFIG_07 }}
      TIER1_NODES_CONFIG_08: ${{ vars.TIER1_NODES_CONFIG_08 }}
      TIER1_NODES_CONFIG_09: ${{ vars.TIER1_NODES_CONFIG_09 }}
      TIER1_NODES_CONFIG_10: ${{ vars.TIER1_NODES_CONFIG_10 }}
      TIER2_NODES_CONFIG_01: ${{ vars.TIER2_NODES_CONFIG_01 }}
      TIER2_NODES_CONFIG_02: ${{ vars.TIER2_NODES_CONFIG_02 }}
      TIER2_NODES_CONFIG_03: ${{ vars.TIER2_NODES_CONFIG_03 }}
      TIER2_NODES_CONFIG_04: ${{ vars.TIER2_NODES_CONFIG_04 }}
      TIER2_NODES_CONFIG_05: ${{ vars.TIER2_NODES_CONFIG_05 }}
      TIER2_NODES_CONFIG_06: ${{ vars.TIER2_NODES_CONFIG_06 }}
      TIER2_NODES_CONFIG_07: ${{ vars.TIER2_NODES_CONFIG_07 }}
      TIER2_NODES_CONFIG_08: ${{ vars.TIER2_NODES_CONFIG_08 }}
      TIER2_NODES_CONFIG_09: ${{ vars.TIER2_NODES_CONFIG_09 }}
      TIER2_NODES_CONFIG_10: ${{ vars.TIER2_NODES_CONFIG_10 }}
      TIER3_NODES_CONFIG_01: ${{ vars.TIER3_NODES_CONFIG_01 }}
      TIER3_NODES_CONFIG_02: ${{ vars.TIER3_NODES_CONFIG_02 }}
      TIER3_NODES_CONFIG_03: ${{ vars.TIER3_NODES_CONFIG_03 }}
      TIER3_NODES_CONFIG_04: ${{ vars.TIER3_NODES_CONFIG_04 }}
      TIER3_NODES_CONFIG_05: ${{ vars.TIER3_NODES_CONFIG_05 }}
      TIER3_NODES_CONFIG_06: ${{ vars.TIER3_NODES_CONFIG_06 }}
      TIER3_NODES_CONFIG_07: ${{ vars.TIER3_NODES_CONFIG_07 }}
      TIER3_NODES_CONFIG_08: ${{ vars.TIER3_NODES_CONFIG_08 }}
      TIER3_NODES_CONFIG_09: ${{ vars.TIER3_NODES_CONFIG_09 }}
      TIER3_NODES_CONFIG_10: ${{ vars.TIER3_NODES_CONFIG_10 }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GATEWAY_ACCESS_KEY_AIR: ${{ secrets.GATEWAY_ACCESS_KEY_AIR }}
      GATEWAY_ACCESS_MODELS_AIR: ${{ vars.GATEWAY_ACCESS_MODELS_AIR }}
      GATEWAY_ACCESS_KEY_PRO: ${{ secrets.GATEWAY_ACCESS_KEY_PRO }}
      GATEWAY_ACCESS_MODELS_PRO: ${{ vars.GATEWAY_ACCESS_MODELS_PRO }}
      GATEWAY_ACCESS_KEY_MAX: ${{ secrets.GATEWAY_ACCESS_KEY_MAX }}
      GATEWAY_ACCESS_MODELS_MAX: ${{ vars.GATEWAY_ACCESS_MODELS_MAX }}
      GATEWAY_ACCESS_KEY_ULTRA: ${{ secrets.GATEWAY_ACCESS_KEY_ULTRA }}
      GATEWAY_ACCESS_MODELS_ULTRA: ${{ vars.GATEWAY_ACCESS_MODELS_ULTRA }}
      GATEWAY_ACCESS_KEY_AGENT: ${{ secrets.GATEWAY_ACCESS_KEY_AGENT }}
      GATEWAY_ACCESS_MODELS_AGENT: ${{ vars.GATEWAY_ACCESS_MODELS_AGENT }}
      TIER1_NODES_SECRETS_01: ${{ secrets.TIER1_NODES_SECRETS_01 }}
      TIER1_NODES_SECRETS_02: ${{ secrets.TIER1_NODES_SECRETS_02 }}
      TIER1_NODES_SECRETS_03: ${{ secrets.TIER1_NODES_SECRETS_03 }}
      TIER1_NODES_SECRETS_04: ${{ secrets.TIER1_NODES_SECRETS_04 }}
      TIER1_NODES_SECRETS_05: ${{ secrets.TIER1_NODES_SECRETS_05 }}
      TIER1_NODES_SECRETS_06: ${{ secrets.TIER1_NODES_SECRETS_06 }}
      TIER1_NODES_SECRETS_07: ${{ secrets.TIER1_NODES_SECRETS_07 }}
      TIER1_NODES_SECRETS_08: ${{ secrets.TIER1_NODES_SECRETS_08 }}
      TIER1_NODES_SECRETS_09: ${{ secrets.TIER1_NODES_SECRETS_09 }}
      TIER1_NODES_SECRETS_10: ${{ secrets.TIER1_NODES_SECRETS_10 }}
      TIER2_NODES_SECRETS_01: ${{ secrets.TIER2_NODES_SECRETS_01 }}
      TIER2_NODES_SECRETS_02: ${{ secrets.TIER2_NODES_SECRETS_02 }}
      TIER2_NODES_SECRETS_03: ${{ secrets.TIER2_NODES_SECRETS_03 }}
      TIER2_NODES_SECRETS_04: ${{ secrets.TIER2_NODES_SECRETS_04 }}
      TIER2_NODES_SECRETS_05: ${{ secrets.TIER2_NODES_SECRETS_05 }}
      TIER2_NODES_SECRETS_06: ${{ secrets.TIER2_NODES_SECRETS_06 }}
      TIER2_NODES_SECRETS_07: ${{ secrets.TIER2_NODES_SECRETS_07 }}
      TIER2_NODES_SECRETS_08: ${{ secrets.TIER2_NODES_SECRETS_08 }}
      TIER2_NODES_SECRETS_09: ${{ secrets.TIER2_NODES_SECRETS_09 }}
      TIER2_NODES_SECRETS_10: ${{ secrets.TIER2_NODES_SECRETS_10 }}
      TIER3_NODES_SECRETS_01: ${{ secrets.TIER3_NODES_SECRETS_01 }}
      TIER3_NODES_SECRETS_02: ${{ secrets.TIER3_NODES_SECRETS_02 }}
      TIER3_NODES_SECRETS_03: ${{ secrets.TIER3_NODES_SECRETS_03 }}
      TIER3_NODES_SECRETS_04: ${{ secrets.TIER3_NODES_SECRETS_04 }}
      TIER3_NODES_SECRETS_05: ${{ secrets.TIER3_NODES_SECRETS_05 }}
      TIER3_NODES_SECRETS_06: ${{ secrets.TIER3_NODES_SECRETS_06 }}
      TIER3_NODES_SECRETS_07: ${{ secrets.TIER3_NODES_SECRETS_07 }}
      TIER3_NODES_SECRETS_08: ${{ secrets.TIER3_NODES_SECRETS_08 }}
      TIER3_NODES_SECRETS_09: ${{ secrets.TIER3_NODES_SECRETS_09 }}
      TIER3_NODES_SECRETS_10: ${{ secrets.TIER3_NODES_SECRETS_10 }}
    steps:
      - name: Checkout triggering commit
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - name: Checkout (manual dispatch)
        if: github.event_name != 'workflow_run'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preflight deployment configuration
        run: node scripts/github-deployment-config.mjs preflight

      - name: Validate runtime configuration
        run: |
          node scripts/github-deployment-config.mjs prepare --from-env \
            --wrangler "$RUNNER_TEMP/wrangler.github.json" \
            --secrets "$RUNNER_TEMP/gateway-secrets.json" \
            --summary "$RUNNER_TEMP/deployment-summary.txt"

      - name: Apply D1 migrations
        if: env.TOKEN_STATS_D1_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TOKEN_STATS_D1_ID: ${{ vars.TOKEN_STATS_D1_ID }}
        run: npx --yes wrangler@4.114.0 d1 migrations apply ai-gateway-stats --remote -c "$RUNNER_TEMP/wrangler.github.json"

      - name: Deploy Worker (atomic code+secrets)
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.114.0 deploy --secrets-file "$RUNNER_TEMP/gateway-secrets.json" -c "$RUNNER_TEMP/wrangler.github.json"

      - name: Verify deployed gateway
        id: health-check
        run: node scripts/github-deployment-config.mjs health-check --from-env --expected-build "$DEPLOYED_SHA"

      - name: Rollback to previous Worker version
        id: rollback
        if: failure() && steps.deploy.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "::notice::Rolling back Worker code for deployed SHA: ${DEPLOYED_SHA}"
          npx --yes wrangler@4.114.0 rollback -c "$RUNNER_TEMP/wrangler.github.json"

      - name: Verify rolled-back gateway
        if: failure() && steps.rollback.outcome == 'success'
        run: |
          node scripts/github-deployment-config.mjs health-check --from-env || {
            echo "::error::Rollback health check also failed — the previous version may not be healthy either. Manual intervention required."
            exit 1
          }

      - name: Deployment summary
        if: success()
        env:
          DEPLOYED_SHA: ${{ env.DEPLOYED_SHA }}
        run: |
          {
            cat "$RUNNER_TEMP/deployment-summary.txt"
            echo ""
            echo "Identity"
            echo "  Deployed SHA: ${DEPLOYED_SHA}"
          } | tee "$GITHUB_STEP_SUMMARY"
