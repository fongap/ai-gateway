name: Deploy

# Push-to-main auto deploy. Deployment material (real D1 database id, API
# token) lives only in encrypted repo secrets — never in the repo itself.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore operator config
        run: printf '%s' "${{ secrets.WRANGLER_USER_CONFIG }}" > wrangler.user.jsonc

      - name: Syntax check
        run: node scripts/check-syntax.mjs

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.114.0 deploy -c wrangler.user.jsonc --keep-vars
