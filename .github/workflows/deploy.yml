name: Deploy

# Push-to-main auto deploy. Fork-specific GitHub Variables plus GitHub Secrets
# are the deployment source; the Cloudflare Dashboard is never a second
# configuration source. Pipeline: preflight → verify → validate configuration
# → dry-run → auth → synchronize Secrets → D1 migrations → Worker deploy
# → authenticated health checks.
#
# Configuration is read from INDIVIDUAL GitHub Variables / Secrets (long-term
# target). The legacy GATEWAY_CONFIG / GATEWAY_SECRETS_CONFIG blobs remain
# supported as a deprecated fallback while operators migrate; new individual
# sources always win and the two are never merged.
#
# GitHub Actions cannot enumerate Secret values dynamically, so managed secret
# shards are injected via a fixed range (NODE_SECRETS_01..20). Unset entries
# arrive as empty strings and are skipped. Raise the range in the env block
# below if a deployment needs more than 20 credential shards. The same fixed
# range is used for TIER*_NODES_CONFIG_01..10 variables.
#
# Main repository: Deploy always runs (a missing required config FAILS here,
# it is never skipped). Forks: opt in with DEPLOY_ENABLED=true.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'fongap/ai-gateway' || vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # --- Non-sensitive GitHub Variables (fixed range; unset => empty) ---
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TOKEN_STATS_D1_ID: ${{ vars.TOKEN_STATS_D1_ID }}
      GATEWAY_PUBLIC_BASE_URL: ${{ vars.GATEWAY_PUBLIC_BASE_URL }}
      MODELS_CONFIG: ${{ vars.MODELS_CONFIG }}
      POLICIES_CONFIG: ${{ vars.POLICIES_CONFIG }}
      TIER1_NODES_CONFIG_01: ${{ vars.TIER1_NODES_CONFIG_01 }}
      TIER1_NODES_CONFIG_02: ${{ vars.TIER1_NODES_CONFIG_02 }}
      TIER1_NODES_CONFIG_03: ${{ vars.TIER1_NODES_CONFIG_03 }}
      TIER1_NODES_CONFIG_04: ${{ vars.TIER1_NODES_CONFIG_04 }}
      TIER1_NODES_CONFIG_05: ${{ vars.TIER1_NODES_CONFIG_05 }}
      TIER1_NODES_CONFIG_06: ${{ vars.TIER1_NODES_CONFIG_06 }}
      TIER1_NODES_CONFIG_07: ${{ vars.TIER1_NODES_CONFIG_07 }}
      TIER1_NODES_CONFIG_08: ${{ vars.TIER1_NODES_CONFIG_08 }}
      TIER1_NODES_CONFIG_09: ${{ vars.TIER1_NODES_CONFIG_09 }}
      TIER1_NODES_CONFIG_10: ${{ vars.TIER1_NODES_CONFIG_10 }}
      TIER2_NODES_CONFIG_01: ${{ vars.TIER2_NODES_CONFIG_01 }}
      TIER2_NODES_CONFIG_02: ${{ vars.TIER2_NODES_CONFIG_02 }}
      TIER2_NODES_CONFIG_03: ${{ vars.TIER2_NODES_CONFIG_03 }}
      TIER2_NODES_CONFIG_04: ${{ vars.TIER2_NODES_CONFIG_04 }}
      TIER2_NODES_CONFIG_05: ${{ vars.TIER2_NODES_CONFIG_05 }}
      TIER2_NODES_CONFIG_06: ${{ vars.TIER2_NODES_CONFIG_06 }}
      TIER2_NODES_CONFIG_07: ${{ vars.TIER2_NODES_CONFIG_07 }}
      TIER2_NODES_CONFIG_08: ${{ vars.TIER2_NODES_CONFIG_08 }}
      TIER2_NODES_CONFIG_09: ${{ vars.TIER2_NODES_CONFIG_09 }}
      TIER2_NODES_CONFIG_10: ${{ vars.TIER2_NODES_CONFIG_10 }}
      TIER3_NODES_CONFIG_01: ${{ vars.TIER3_NODES_CONFIG_01 }}
      TIER3_NODES_CONFIG_02: ${{ vars.TIER3_NODES_CONFIG_02 }}
      TIER3_NODES_CONFIG_03: ${{ vars.TIER3_NODES_CONFIG_03 }}
      TIER3_NODES_CONFIG_04: ${{ vars.TIER3_NODES_CONFIG_04 }}
      TIER3_NODES_CONFIG_05: ${{ vars.TIER3_NODES_CONFIG_05 }}
      TIER3_NODES_CONFIG_06: ${{ vars.TIER3_NODES_CONFIG_06 }}
      TIER3_NODES_CONFIG_07: ${{ vars.TIER3_NODES_CONFIG_07 }}
      TIER3_NODES_CONFIG_08: ${{ vars.TIER3_NODES_CONFIG_08 }}
      TIER3_NODES_CONFIG_09: ${{ vars.TIER3_NODES_CONFIG_09 }}
      TIER3_NODES_CONFIG_10: ${{ vars.TIER3_NODES_CONFIG_10 }}
      GATEWAY_CONFIG: ${{ vars.GATEWAY_CONFIG }}
      # --- GitHub Secrets (fixed range; unset => empty, skipped) ---
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GATEWAY_ACCESS_KEY: ${{ secrets.GATEWAY_ACCESS_KEY }}
      NODE_SECRETS_01: ${{ secrets.NODE_SECRETS_01 }}
      NODE_SECRETS_02: ${{ secrets.NODE_SECRETS_02 }}
      NODE_SECRETS_03: ${{ secrets.NODE_SECRETS_03 }}
      NODE_SECRETS_04: ${{ secrets.NODE_SECRETS_04 }}
      NODE_SECRETS_05: ${{ secrets.NODE_SECRETS_05 }}
      NODE_SECRETS_06: ${{ secrets.NODE_SECRETS_06 }}
      NODE_SECRETS_07: ${{ secrets.NODE_SECRETS_07 }}
      NODE_SECRETS_08: ${{ secrets.NODE_SECRETS_08 }}
      NODE_SECRETS_09: ${{ secrets.NODE_SECRETS_09 }}
      NODE_SECRETS_10: ${{ secrets.NODE_SECRETS_10 }}
      NODE_SECRETS_11: ${{ secrets.NODE_SECRETS_11 }}
      NODE_SECRETS_12: ${{ secrets.NODE_SECRETS_12 }}
      NODE_SECRETS_13: ${{ secrets.NODE_SECRETS_13 }}
      NODE_SECRETS_14: ${{ secrets.NODE_SECRETS_14 }}
      NODE_SECRETS_15: ${{ secrets.NODE_SECRETS_15 }}
      NODE_SECRETS_16: ${{ secrets.NODE_SECRETS_16 }}
      NODE_SECRETS_17: ${{ secrets.NODE_SECRETS_17 }}
      NODE_SECRETS_18: ${{ secrets.NODE_SECRETS_18 }}
      NODE_SECRETS_19: ${{ secrets.NODE_SECRETS_19 }}
      NODE_SECRETS_20: ${{ secrets.NODE_SECRETS_20 }}
      GATEWAY_SECRETS_CONFIG: ${{ secrets.GATEWAY_SECRETS_CONFIG }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preflight deployment configuration
        run: node scripts/github-deployment-config.mjs preflight

      - name: Verify project
        run: npm run verify

      - name: Validate runtime configuration
        run: |
          node scripts/github-deployment-config.mjs prepare --from-env \
            --wrangler "$RUNNER_TEMP/wrangler.github.json" \
            --secrets "$RUNNER_TEMP/gateway-secrets.json" \
            --summary "$RUNNER_TEMP/deployment-summary.txt"

      - name: Dry-run Worker bundle
        run: npx --yes wrangler@4.114.0 deploy --dry-run -c "$RUNNER_TEMP/wrangler.github.json"

      - name: Cloudflare authentication check
        run: npx --yes wrangler@4.114.0 whoami

      - name: Synchronize Worker Secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.114.0 secret list --format json -c "$RUNNER_TEMP/wrangler.github.json" > "$RUNNER_TEMP/current-secrets.json" \
            || printf '[]' > "$RUNNER_TEMP/current-secrets.json"
          node scripts/github-deployment-config.mjs prepare --from-env \
            --existing-secrets "$RUNNER_TEMP/current-secrets.json" \
            --wrangler "$RUNNER_TEMP/wrangler.github.json" \
            --secrets "$RUNNER_TEMP/gateway-secrets.json" \
            --summary "$RUNNER_TEMP/deployment-summary.txt"
          npx --yes wrangler@4.114.0 secret bulk "$RUNNER_TEMP/gateway-secrets.json" -c "$RUNNER_TEMP/wrangler.github.json"

      - name: Apply D1 migrations
        if: env.TOKEN_STATS_D1_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TOKEN_STATS_D1_ID: ${{ vars.TOKEN_STATS_D1_ID }}
        run: npx --yes wrangler@4.114.0 d1 migrations apply ai-gateway-stats --remote -c "$RUNNER_TEMP/wrangler.github.json"

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.114.0 deploy -c "$RUNNER_TEMP/wrangler.github.json"

      - name: Verify deployed gateway
        run: node scripts/github-deployment-config.mjs health-check --from-env

      - name: Deployment summary
        if: success()
        run: |
          cat "$RUNNER_TEMP/deployment-summary.txt" | tee "$GITHUB_STEP_SUMMARY"
