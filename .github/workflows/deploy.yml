name: Deploy

# Push-to-main auto deploy. Fork-specific GitHub Variables plus GitHub Secrets
# are the deployment source; the Cloudflare Dashboard is never a second
# configuration source.
#
# Production gate: this workflow is triggered by `workflow_run` when the CI
# workflow completes on main. CI success means BOTH of its jobs passed —
# validate-merge (syntax + config + unit + typecheck + security + docs +
# bundle dry-run) AND validate-deploy (unit + scheduler stability +
# integration + stress + Codex/Claude contract + security + docs). Worker
# Deploy therefore never executes before full validation succeeds, and the
# full suite is executed exactly once per push (Merge Gate != Production
# Gate; no duplicated validation).
#
# Gate rules (scripts/deploy-gate-decision.mjs, unit-tested):
#   * workflow_run from a fork head repository        -> never deploy
#   * CI run triggered by anything other than a push  -> never deploy
#     (scheduled nightly CI and manual CI runs are test-only)
#   * CI conclusion != success                        -> never deploy
#   * triggering commit touched ONLY **.md / docs/**  -> skip deploy
#   * manual workflow_dispatch                        -> allowed, but NEVER a
#     bypass: the `manual-validate` job runs the single `validate:deploy`
#     entry point inside this workflow before the deploy job may start. Only
#     the manual path re-runs validation (it is not a high-frequency
#     operation); the automatic main-push path reuses the already-completed
#     CI run.
#
# Pipeline: preflight → validate configuration → D1 migrations (if configured)
# → atomic Worker deploy (code + secrets in a single
# `wrangler deploy --secrets-file` operation) → authenticated health checks
# → rollback on post-deploy failure. D1 migrations always run BEFORE the new
# Worker is deployed: a migration failure aborts the deploy instead of leaving
# new code running against an old schema.
#
# Configuration is read from INDIVIDUAL GitHub Variables / Secrets (long-term
# target). The legacy GATEWAY_CONFIG / GATEWAY_SECRETS_CONFIG blobs remain
# supported as a deprecated fallback while operators migrate; new individual
# sources always win and the two are never merged.
#
# GitHub Actions cannot enumerate Secret values dynamically, so tier-scoped
# credential shards AND node config shards are injected through a fixed range:
#
#   TIER1_NODES_CONFIG_01..10   (node config — Secrets for log masking)
#   TIER2_NODES_CONFIG_01..10
#   TIER3_NODES_CONFIG_01..10
#   TIER1_NODES_SECRETS_01..10  (credential shards)
#   TIER2_NODES_SECRETS_01..10
#   TIER3_NODES_SECRETS_01..10
#
# Unset entries arrive as empty strings and are skipped.
# Each secret shard corresponds to the node-config shard with the same tier and
# suffix.
#
# Main repository: Deploy always runs (a missing required config FAILS here,
# it is never skipped). Forks: opt in with DEPLOY_ENABLED=true.
#
# R1 (v1.3.0) — Deploy Correctness:
#   * Validated SHA = deployed SHA = deployment metadata SHA.
#   * Every `workflow_run` job (gate, manual-validate, deploy) explicitly
#     checkouts `github.event.workflow_run.head_sha`. Relying on the
#     default `GITHUB_SHA` is insufficient because (a) it can drift if a
#     newer commit lands while CI is running and (b) it is not auditable
#     from the workflow YAML alone.
#   * The deploy job captures the SHA once as `DEPLOYED_SHA` and uses that
#     same value in the deployment summary and the rollback record.
#   * The manual path uses a SINGLE validation entry point
#     (`npm run validate:deploy`) — the old `typecheck:strict` step and
#     the bare `typecheck` step are removed. Pinned by
#     deployment-workflow-contract-test.mjs C11..C15.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  # Gate — decides whether a deploy may happen at all. The decision logic
  # lives in scripts/deploy-gate-decision.mjs (unit-tested by
  # deployment-workflow-contract-test.mjs):
  #   * manual workflow_dispatch            -> deploy (full validation is
  #     mandatory in the manual-validate job — never a silent bypass)
  #   * workflow_run from a fork head repo  -> never deploy
  #   * CI run not triggered by a push (nightly / manual CI) -> never deploy
  #   * CI workflow conclusion != success   -> never deploy (Production Gate)
  #   * triggering commit touched ONLY
  #     **.md / docs/** (old paths-ignore) -> skip deploy
  gate:
    if: github.repository == 'fongap/ai-gateway' || vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - name: Checkout triggering commit
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Decide deploy eligibility
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          THIS_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/deploy-gate-decision.mjs

  # Manual path — full validation INSIDE the deploy workflow. A manual
  # workflow_dispatch must never silently bypass the Production Gate
  # ("Worker Deploy never executes before full validation succeeds"). This
  # job runs the complete CI-equivalent suite; the deploy job below starts
  # only after it succeeds. The automatic main-push path skips this job and
  # reuses the already-completed CI run (validation once per push).
  #
  # R1 (v1.3.0) contract: validated SHA = deployed SHA = deployment
  # metadata SHA. Every `workflow_run` job MUST explicitly checkout the
  # triggering commit so the worker code, validation suite, and recorded
  # metadata all refer to the same commit. Relying on the default
  # `GITHUB_SHA` is not enough — the gate step already pins it for the
  # changed-files check, but the validate and deploy steps must too.
  manual-validate:
    needs: gate
    if: needs.gate.outputs.deploy == 'true' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout triggering commit
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - name: Checkout (manual dispatch)
        if: github.event_name != 'workflow_run'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # R1: unified to a single validation entry point. The npm scripts
      # `typecheck:strict` and the bare `typecheck` step are removed — the
      # full deploy suite is the only contract the manual path must satisfy,
      # identical to what CI runs on the automatic main-push path.
      - name: Validate (deploy suite — single entry point)
        run: npm run validate:deploy

      - name: Dry-run Worker bundle
        run: npm run check:deploy

  deploy:
    needs: [gate, manual-validate]
    # `always()` is REQUIRED here: when a needed job is skipped (the
    # automatic path skips manual-validate), GitHub skips dependent jobs
    # unless the if expression carries a status-check function that lifts
    # the skip. Safety comes from the explicit guards, not from the
    # default: gate must have decided deploy=true, and on the manual path
    # manual-validate must have SUCCEEDED (a cancelled or failed
    # validation is neither success nor skipped, so it still blocks).
    if: always() && needs.gate.outputs.deploy == 'true' && (needs.manual-validate.result == 'success' || needs.manual-validate.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # R1: a single SHA identifier is captured and used everywhere in this
      # job — checkout, deployment summary, rollback record, and the
      # wrapper logs. Validated SHA == deployed SHA == metadata SHA.
      DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      # R2 (v1.3.0): same SHA is also injected as the `GITHUB_SHA` Worker
      # text variable so the runtime can expose it as the deployment
      # identity on `GET /version` (the `build` field). The deployment
      # bridge recognises `GITHUB_SHA` via its allow-list (no runtime
      # tunable registry entry is required because it is a deploy-time
      # identity, not a runtime control). Validated SHA == deployed SHA
      # == Worker build identity.
      GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      # --- Non-sensitive GitHub Variables (fixed range; unset => empty) ---
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TOKEN_STATS_D1_ID: ${{ vars.TOKEN_STATS_D1_ID }}
      TIER1_AFFINITY_KV_ID: ${{ vars.TIER1_AFFINITY_KV_ID }}
      GATEWAY_PUBLIC_BASE_URL: ${{ vars.GATEWAY_PUBLIC_BASE_URL }}
      MODELS_CONFIG: ${{ vars.MODELS_CONFIG }}
      POLICIES_CONFIG: ${{ vars.POLICIES_CONFIG }}
      RATE_LIMIT_COOLDOWN_MS: ${{ vars.RATE_LIMIT_COOLDOWN_MS }}
      FIRST_EVENT_TIMEOUT_MS: ${{ vars.FIRST_EVENT_TIMEOUT_MS }}
      STREAM_IDLE_TIMEOUT_MS: ${{ vars.STREAM_IDLE_TIMEOUT_MS }}
      AUTH_FAIL_COOLDOWN_MS: ${{ vars.AUTH_FAIL_COOLDOWN_MS }}
      MAX_BODY_BYTES: ${{ vars.MAX_BODY_BYTES }}
      FAILOVER_BUDGET_MS: ${{ vars.FAILOVER_BUDGET_MS }}
      UPSTREAM_HEADERS_TIMEOUT_MS: ${{ vars.UPSTREAM_HEADERS_TIMEOUT_MS }}
      HEDGE_DELAY_MS: ${{ vars.HEDGE_DELAY_MS }}
      MAX_HEDGES_PER_REQUEST: ${{ vars.MAX_HEDGES_PER_REQUEST }}
      GATEWAY_KEY_RPM: ${{ vars.GATEWAY_KEY_RPM }}
      ALLOWED_ORIGIN: ${{ vars.ALLOWED_ORIGIN }}
      STREAM_INCLUDE_USAGE: ${{ vars.STREAM_INCLUDE_USAGE }}
      STREAM_USAGE_INCLUDE_OFF_PROVIDERS: ${{ vars.STREAM_USAGE_INCLUDE_OFF_PROVIDERS }}
      EXPOSE_UPSTREAM_INFO: ${{ vars.EXPOSE_UPSTREAM_INFO }}
      LOG_LEVEL: ${{ vars.LOG_LEVEL }}
      FAKE_STREAM_PROTECTION: ${{ vars.FAKE_STREAM_PROTECTION }}
      ALLOW_INSECURE_HTTP_UPSTREAM: ${{ vars.ALLOW_INSECURE_HTTP_UPSTREAM }}
      ANTHROPIC_COUNT_TOKENS_MODE: ${{ vars.ANTHROPIC_COUNT_TOKENS_MODE }}
      PROTOCOL_FALLBACKS: ${{ vars.PROTOCOL_FALLBACKS }}
      # Node config shards: stored as Secrets to prevent topology leakage
      # in public Actions logs (provider, base_url, priority, models).
      # Worker runtime treats them as plain text variables — no contract change.
      TIER1_NODES_CONFIG_01: ${{ secrets.TIER1_NODES_CONFIG_01 }}
      TIER1_NODES_CONFIG_02: ${{ secrets.TIER1_NODES_CONFIG_02 }}
      TIER1_NODES_CONFIG_03: ${{ secrets.TIER1_NODES_CONFIG_03 }}
      TIER1_NODES_CONFIG_04: ${{ secrets.TIER1_NODES_CONFIG_04 }}
      TIER1_NODES_CONFIG_05: ${{ secrets.TIER1_NODES_CONFIG_05 }}
      TIER1_NODES_CONFIG_06: ${{ secrets.TIER1_NODES_CONFIG_06 }}
      TIER1_NODES_CONFIG_07: ${{ secrets.TIER1_NODES_CONFIG_07 }}
      TIER1_NODES_CONFIG_08: ${{ secrets.TIER1_NODES_CONFIG_08 }}
      TIER1_NODES_CONFIG_09: ${{ secrets.TIER1_NODES_CONFIG_09 }}
      TIER1_NODES_CONFIG_10: ${{ secrets.TIER1_NODES_CONFIG_10 }}
      TIER2_NODES_CONFIG_01: ${{ secrets.TIER2_NODES_CONFIG_01 }}
      TIER2_NODES_CONFIG_02: ${{ secrets.TIER2_NODES_CONFIG_02 }}
      TIER2_NODES_CONFIG_03: ${{ secrets.TIER2_NODES_CONFIG_03 }}
      TIER2_NODES_CONFIG_04: ${{ secrets.TIER2_NODES_CONFIG_04 }}
      TIER2_NODES_CONFIG_05: ${{ secrets.TIER2_NODES_CONFIG_05 }}
      TIER2_NODES_CONFIG_06: ${{ secrets.TIER2_NODES_CONFIG_06 }}
      TIER2_NODES_CONFIG_07: ${{ secrets.TIER2_NODES_CONFIG_07 }}
      TIER2_NODES_CONFIG_08: ${{ secrets.TIER2_NODES_CONFIG_08 }}
      TIER2_NODES_CONFIG_09: ${{ secrets.TIER2_NODES_CONFIG_09 }}
      TIER2_NODES_CONFIG_10: ${{ secrets.TIER2_NODES_CONFIG_10 }}
      TIER3_NODES_CONFIG_01: ${{ secrets.TIER3_NODES_CONFIG_01 }}
      TIER3_NODES_CONFIG_02: ${{ secrets.TIER3_NODES_CONFIG_02 }}
      TIER3_NODES_CONFIG_03: ${{ secrets.TIER3_NODES_CONFIG_03 }}
      TIER3_NODES_CONFIG_04: ${{ secrets.TIER3_NODES_CONFIG_04 }}
      TIER3_NODES_CONFIG_05: ${{ secrets.TIER3_NODES_CONFIG_05 }}
      TIER3_NODES_CONFIG_06: ${{ secrets.TIER3_NODES_CONFIG_06 }}
      TIER3_NODES_CONFIG_07: ${{ secrets.TIER3_NODES_CONFIG_07 }}
      TIER3_NODES_CONFIG_08: ${{ secrets.TIER3_NODES_CONFIG_08 }}
      TIER3_NODES_CONFIG_09: ${{ secrets.TIER3_NODES_CONFIG_09 }}
      TIER3_NODES_CONFIG_10: ${{ secrets.TIER3_NODES_CONFIG_10 }}
      GATEWAY_CONFIG: ${{ vars.GATEWAY_CONFIG }}
      # --- GitHub Secrets (fixed range; unset => empty, skipped) ---
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GATEWAY_ACCESS_KEY_AIR: ${{ secrets.GATEWAY_ACCESS_KEY_AIR }}
      GATEWAY_ACCESS_MODELS_AIR: ${{ vars.GATEWAY_ACCESS_MODELS_AIR }}
      GATEWAY_ACCESS_KEY_PRO: ${{ secrets.GATEWAY_ACCESS_KEY_PRO }}
      GATEWAY_ACCESS_MODELS_PRO: ${{ vars.GATEWAY_ACCESS_MODELS_PRO }}
      GATEWAY_ACCESS_KEY_MAX: ${{ secrets.GATEWAY_ACCESS_KEY_MAX }}
      GATEWAY_ACCESS_MODELS_MAX: ${{ vars.GATEWAY_ACCESS_MODELS_MAX }}
      GATEWAY_ACCESS_KEY_ULTRA: ${{ secrets.GATEWAY_ACCESS_KEY_ULTRA }}
      GATEWAY_ACCESS_MODELS_ULTRA: ${{ vars.GATEWAY_ACCESS_MODELS_ULTRA }}
      GATEWAY_ACCESS_KEY_AGENT: ${{ secrets.GATEWAY_ACCESS_KEY_AGENT }}
      GATEWAY_ACCESS_MODELS_AGENT: ${{ vars.GATEWAY_ACCESS_MODELS_AGENT }}
      TIER1_NODES_SECRETS_01: ${{ secrets.TIER1_NODES_SECRETS_01 }}
      TIER1_NODES_SECRETS_02: ${{ secrets.TIER1_NODES_SECRETS_02 }}
      TIER1_NODES_SECRETS_03: ${{ secrets.TIER1_NODES_SECRETS_03 }}
      TIER1_NODES_SECRETS_04: ${{ secrets.TIER1_NODES_SECRETS_04 }}
      TIER1_NODES_SECRETS_05: ${{ secrets.TIER1_NODES_SECRETS_05 }}
      TIER1_NODES_SECRETS_06: ${{ secrets.TIER1_NODES_SECRETS_06 }}
      TIER1_NODES_SECRETS_07: ${{ secrets.TIER1_NODES_SECRETS_07 }}
      TIER1_NODES_SECRETS_08: ${{ secrets.TIER1_NODES_SECRETS_08 }}
      TIER1_NODES_SECRETS_09: ${{ secrets.TIER1_NODES_SECRETS_09 }}
      TIER1_NODES_SECRETS_10: ${{ secrets.TIER1_NODES_SECRETS_10 }}
      TIER2_NODES_SECRETS_01: ${{ secrets.TIER2_NODES_SECRETS_01 }}
      TIER2_NODES_SECRETS_02: ${{ secrets.TIER2_NODES_SECRETS_02 }}
      TIER2_NODES_SECRETS_03: ${{ secrets.TIER2_NODES_SECRETS_03 }}
      TIER2_NODES_SECRETS_04: ${{ secrets.TIER2_NODES_SECRETS_04 }}
      TIER2_NODES_SECRETS_05: ${{ secrets.TIER2_NODES_SECRETS_05 }}
      TIER2_NODES_SECRETS_06: ${{ secrets.TIER2_NODES_SECRETS_06 }}
      TIER2_NODES_SECRETS_07: ${{ secrets.TIER2_NODES_SECRETS_07 }}
      TIER2_NODES_SECRETS_08: ${{ secrets.TIER2_NODES_SECRETS_08 }}
      TIER2_NODES_SECRETS_09: ${{ secrets.TIER2_NODES_SECRETS_09 }}
      TIER2_NODES_SECRETS_10: ${{ secrets.TIER2_NODES_SECRETS_10 }}
      TIER3_NODES_SECRETS_01: ${{ secrets.TIER3_NODES_SECRETS_01 }}
      TIER3_NODES_SECRETS_02: ${{ secrets.TIER3_NODES_SECRETS_02 }}
      TIER3_NODES_SECRETS_03: ${{ secrets.TIER3_NODES_SECRETS_03 }}
      TIER3_NODES_SECRETS_04: ${{ secrets.TIER3_NODES_SECRETS_04 }}
      TIER3_NODES_SECRETS_05: ${{ secrets.TIER3_NODES_SECRETS_05 }}
      TIER3_NODES_SECRETS_06: ${{ secrets.TIER3_NODES_SECRETS_06 }}
      TIER3_NODES_SECRETS_07: ${{ secrets.TIER3_NODES_SECRETS_07 }}
      TIER3_NODES_SECRETS_08: ${{ secrets.TIER3_NODES_SECRETS_08 }}
      TIER3_NODES_SECRETS_09: ${{ secrets.TIER3_NODES_SECRETS_09 }}
      TIER3_NODES_SECRETS_10: ${{ secrets.TIER3_NODES_SECRETS_10 }}
      GATEWAY_SECRETS_CONFIG: ${{ secrets.GATEWAY_SECRETS_CONFIG }}
    steps:
      - name: Checkout triggering commit
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - name: Checkout (manual dispatch)
        if: github.event_name != 'workflow_run'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preflight deployment configuration
        run: node scripts/github-deployment-config.mjs preflight

      - name: Validate runtime configuration
        run: |
          node scripts/github-deployment-config.mjs prepare --from-env \
            --wrangler "$RUNNER_TEMP/wrangler.github.json" \
            --secrets "$RUNNER_TEMP/gateway-secrets.json" \
            --summary "$RUNNER_TEMP/deployment-summary.txt"

      - name: Apply D1 migrations
        if: env.TOKEN_STATS_D1_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TOKEN_STATS_D1_ID: ${{ vars.TOKEN_STATS_D1_ID }}
        run: npx --yes wrangler@4.114.0 d1 migrations apply ai-gateway-stats --remote -c "$RUNNER_TEMP/wrangler.github.json"

      - name: Deploy Worker (atomic code+secrets)
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.114.0 deploy --secrets-file "$RUNNER_TEMP/gateway-secrets.json" -c "$RUNNER_TEMP/wrangler.github.json"



      - name: Verify deployed gateway
        id: health-check
        run: node scripts/github-deployment-config.mjs health-check --from-env --expected-build "$DEPLOYED_SHA"

      - name: Rollback to previous Worker version
        id: rollback
        if: failure() && steps.deploy.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "::warning::Post-deploy health check failed — rolling back Worker code to the previous version."
          echo "Worker variables, secrets and D1 migrations are NOT rolled back (see docs/operations/deployment.md)."
          # R1: record the SHA of the deployment that was rolled back, so the
          # rolled-back-from SHA is auditable in the workflow run log. The
          # SHA is the SAME as the validated SHA captured at the top of this
          # job (validated SHA = deployed SHA = metadata SHA).
          echo "::notice::Rolling back Worker code for deployed SHA: ${DEPLOYED_SHA}"
          npx --yes wrangler@4.114.0 rollback -c "$RUNNER_TEMP/wrangler.github.json"

      - name: Verify rolled-back gateway
        if: failure() && steps.rollback.outcome == 'success'
        run: |
          node scripts/github-deployment-config.mjs health-check --from-env || {
            echo "::error::Rollback health check also failed — the previous version may not be healthy either. Manual intervention required."
            exit 1
          }

      - name: Deployment summary
        if: success()
        env:
          DEPLOYED_SHA: ${{ env.DEPLOYED_SHA }}
        run: |
          # R1: append the deployed SHA to the deployment summary so the
          # validated / deployed / metadata SHA are all visible in the
          # same artifact. This is the single record used by
          # deployment-workflow-contract-test.mjs to pin the contract.
          {
            cat "$RUNNER_TEMP/deployment-summary.txt"
            echo ""
            echo "Identity"
            echo "  Deployed SHA: ${DEPLOYED_SHA}"
          } | tee "$GITHUB_STEP_SUMMARY"
