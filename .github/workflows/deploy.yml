name: Deploy

# Push-to-main auto deploy. Deployment material (real D1 database id, API
# token) lives only in encrypted repo secrets — never in the repo itself.
# Pipeline: full verify → D1 migrations apply → Worker deploy.
#
# The full verification (npm ci → npm run verify → npm run check:deploy) runs
# INSIDE this workflow before any migration or deploy step. This guarantees
# migrations and the Worker publish can NEVER execute before syntax checks,
# tests, config checks, secret scan and a dry-run bundle all pass — even if the
# CI workflow (which triggers separately on push) has not finished yet.
#
# Migrations run BEFORE deploy so the DB schema is ready when new code goes
# live. Wrangler tracks applied migrations via the d1_migrations table, so
# already-applied migrations are never re-run.
#
# Rule: never modify an already-applied migration — only add the next number.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore operator config
        run: |
          cat > wrangler.user.jsonc <<'EOF'
          {
            "name": "ai-gateway",
            "main": "src/index.js",
            "compatibility_date": "2026-08-06",
            "workers_dev": true,
            "keep_vars": true,
            "observability": { "enabled": true },
            "triggers": { "crons": ["0 3 * * *"] },
            "d1_databases": [
              {
                "binding": "TOKEN_STATS_DB",
                "database_name": "ai-gateway-stats",
                "database_id": "${{ secrets.TOKEN_STATS_D1_ID }}",
                "migrations_dir": "migrations"
              }
            ]
          }
          EOF
          node -e "JSON.parse(require('fs').readFileSync('wrangler.user.jsonc','utf8'))" \
            || { echo '::error::generated wrangler.user.jsonc is not valid JSON'; exit 1; }

      - name: Verify project
        run: npm run verify

      - name: Dry-run Worker bundle
        run: npm run check:deploy

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.114.0 d1 migrations apply ai-gateway-stats --remote -c wrangler.user.jsonc

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.114.0 deploy -c wrangler.user.jsonc --keep-vars
