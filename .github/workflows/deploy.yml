name: Deploy

# Push-to-main auto deploy. Fork-specific GitHub Variables plus GitHub Secrets
# containing only credentials are the deployment source; the Cloudflare
# Dashboard is never a second configuration source. Pipeline: verify →
# validate configuration → synchronize Worker text variables and Worker Secrets
# → D1 migrations → Worker deployment → authenticated health checks.
#
# The full verification (npm ci → npm run verify → generated-config dry run)
# runs INSIDE this workflow before any migration or deploy step. This guarantees
# migrations and the Worker publish can NEVER execute before syntax checks,
# tests, runtime-config checks, secret scan and a dry-run bundle all pass — even
# if the CI workflow (which triggers separately on push) has not finished yet.
#
# Migrations run BEFORE deploy so the DB schema is ready when new code goes
# live. Wrangler tracks applied migrations via the d1_migrations table, so
# already-applied migrations are never re-run.
#
# Rule: never modify an already-applied migration — only add the next number.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    # Forks stay green until their owner supplies the non-sensitive gateway
    # configuration Variable. Once enabled, missing credentials/configuration
    # remain hard failures rather than silently deploying a broken Worker.
    if: vars.GATEWAY_CONFIG != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare deployment configuration
        run: |
          if [ -z "$GATEWAY_CONFIG" ]; then
            echo "::error::Missing GitHub repository variable GATEWAY_CONFIG. Copy config/worker-vars.example.json into it and replace the example values."
            exit 1
          fi
          if [ -z "$GATEWAY_SECRETS_CONFIG" ]; then
            echo "::error::Missing GitHub repository Secret GATEWAY_SECRETS_CONFIG."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing GitHub repository variable CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          printf '%s' "$GATEWAY_CONFIG" > "$RUNNER_TEMP/gateway-vars-input.json"
          printf '%s' "$GATEWAY_SECRETS_CONFIG" > "$RUNNER_TEMP/gateway-secrets-input.json"
          node scripts/github-deployment-config.mjs prepare \
            --vars "$RUNNER_TEMP/gateway-vars-input.json" \
            --secrets-input "$RUNNER_TEMP/gateway-secrets-input.json" \
            --wrangler "$RUNNER_TEMP/wrangler.github.json" \
            --secrets "$RUNNER_TEMP/gateway-secrets.json"
        env:
          GATEWAY_CONFIG: ${{ vars.GATEWAY_CONFIG }}
          GATEWAY_SECRETS_CONFIG: ${{ secrets.GATEWAY_SECRETS_CONFIG }}
          TOKEN_STATS_D1_ID: ${{ vars.TOKEN_STATS_D1_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify project
        run: npm run verify

      - name: Dry-run Worker bundle
        run: npx --yes wrangler@4.114.0 deploy --dry-run -c "$RUNNER_TEMP/wrangler.github.json"

      - name: Synchronize Worker Secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.114.0 secret list --format json -c "$RUNNER_TEMP/wrangler.github.json" > "$RUNNER_TEMP/current-secrets.json" \
            || printf '[]' > "$RUNNER_TEMP/current-secrets.json"
          node scripts/github-deployment-config.mjs prepare \
            --vars "$RUNNER_TEMP/gateway-vars-input.json" \
            --secrets-input "$RUNNER_TEMP/gateway-secrets-input.json" \
            --wrangler "$RUNNER_TEMP/wrangler.github.json" \
            --secrets "$RUNNER_TEMP/gateway-secrets.json" \
            --existing-secrets "$RUNNER_TEMP/current-secrets.json"
          npx --yes wrangler@4.114.0 secret bulk "$RUNNER_TEMP/gateway-secrets.json" -c "$RUNNER_TEMP/wrangler.github.json"

      - name: Apply D1 migrations
        if: vars.TOKEN_STATS_D1_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TOKEN_STATS_D1_ID: ${{ vars.TOKEN_STATS_D1_ID }}
        run: npx --yes wrangler@4.114.0 d1 migrations apply ai-gateway-stats --remote -c "$RUNNER_TEMP/wrangler.github.json"

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.114.0 deploy -c "$RUNNER_TEMP/wrangler.github.json"

      - name: Verify deployed gateway
        env:
          GATEWAY_PUBLIC_BASE_URL: ${{ vars.GATEWAY_PUBLIC_BASE_URL }}
          GATEWAY_CONFIG: ${{ vars.GATEWAY_CONFIG }}
          GATEWAY_SECRETS_CONFIG: ${{ secrets.GATEWAY_SECRETS_CONFIG }}
        run: |
          printf '%s' "$GATEWAY_CONFIG" > "$RUNNER_TEMP/gateway-vars-input.json"
          printf '%s' "$GATEWAY_SECRETS_CONFIG" > "$RUNNER_TEMP/gateway-secrets-input.json"
          node scripts/github-deployment-config.mjs health-check \
            --vars "$RUNNER_TEMP/gateway-vars-input.json" \
            --secrets-input "$RUNNER_TEMP/gateway-secrets-input.json"
