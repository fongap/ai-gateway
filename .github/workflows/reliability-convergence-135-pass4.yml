name: Reliability Convergence Cleanup

on:
  push:
    branches: [fix/reliability-convergence-1.3.5]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/reliability-convergence-1.3.5
          fetch-depth: 0

      - name: Final convergence cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('tests/architecture-contract-test.mjs')
          s = p.read_text(encoding='utf-8')
          old = """  const res = await worker.fetch(messagesRequest({}), env, {});\n  assert.equal(res.status, 503, 'removed limits field makes runtime configuration invalid');\n  assert.equal(upstreamCalls.length, 0, 'invalid legacy config must never reach upstream');\n"""
          new = """  const health = await worker.fetch(new Request('https://gateway.example.com/health', { headers: { authorization: `Bearer ${ACCESS_KEY}` } }), env, {});\n  assert.equal(health.status, 503, 'health must expose invalid runtime configuration');\n  const healthBody = await health.json();\n  assert.equal(healthBody.status, 'invalid');\n  assert.ok(healthBody.diagnostics.some((d) => d.includes('unknown field \\\"limits\\\"')));\n  const res = await worker.fetch(messagesRequest({}), env, {});\n  assert.equal(res.status, 404, 'invalid node is excluded, so the model route is unavailable');\n  assert.equal(upstreamCalls.length, 0, 'invalid legacy config must never reach upstream');\n"""
          if s.count(old) != 1:
              raise SystemExit('Contract 09 source drift')
          s = s.replace(old, new, 1)

          # Direct scheduler fixtures are RuntimeNode-shaped test data, not
          # configuration. Remove the retired field there too so tests describe
          # only the current architecture.
          s = s.replace(", limits: { concurrency: 1, rpm: 0, rpmMode: 'hard' }", "")
          p.write_text(s, encoding='utf-8')
          PY

          rm -f scripts/reliability-convergence-135-pass4.py
          rm -f scripts/reliability-convergence-135-pass4b.py
          rm -f .github/workflows/reliability-convergence-135-pass4.yml

      - name: Validate cleanup
        run: |
          git diff --check
          node tests/architecture-contract-test.mjs

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: finalize strict reliability contracts"
          git push origin HEAD:fix/reliability-convergence-1.3.5
