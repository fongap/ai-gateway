name: Fix final provider fixture
on:
  push:
    branches: [fix/provider-capability-contract]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[final-provider-fixture]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/provider-capability-contract
      - name: Remove retired wire fields from closed-catalog config fixture
        shell: python
        run: |
          from pathlib import Path
          p = Path('tests/architecture-contract-test.mjs')
          s = p.read_text()
          old = "id: 'wc1', provider: 'mock', protocol: 'openai', surfaces: ['chat_completions'],\n    base_url: 'https://wc1.example.com/v1', models: {},"
          new = "id: 'wc1', provider: 'mock',\n    base_url: 'https://wc1.example.com/v1', models: {},"
          if s.count(old) != 1:
              raise SystemExit(f'expected one closed-catalog fixture, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/architecture-contract-test.mjs
          git commit -m "test: fix final provider-profile fixture [final-provider-fixture]"
          git push origin HEAD:fix/provider-capability-contract
