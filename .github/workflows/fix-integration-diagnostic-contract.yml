name: Fix integration diagnostic contract

on:
  push:
    branches: [fix/provider-capability-contract]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[integration-diagnostic-contract]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/provider-capability-contract

      - name: Stop over-specifying parser diagnostic enumeration
        shell: python
        run: |
          from pathlib import Path
          p = Path('tests/integration-test.mjs')
          s = p.read_text()
          old = '''  assert.ok(body.diagnostics.some((d) => d.includes('unknown field "protocol"')));
  assert.ok(body.diagnostics.some((d) => d.includes('unknown field "surfaces"')));'''
          new = '''  assert.ok(body.diagnostics.some((d) =>
    d.includes('unknown field "protocol"') || d.includes('unknown field "surfaces"')
  ));'''
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one diagnostic assertion pair, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          git add tests/integration-test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "test: pin provider-field rejection without diagnostic overfit [integration-diagnostic-contract]"
          git push origin HEAD:fix/provider-capability-contract
