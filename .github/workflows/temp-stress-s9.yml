name: Temporary stress S9 repair

on:
  push:
    branches:
      - fix/stress-429-gate

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stress-429-gate
          fetch-depth: 0

      - name: Align ambiguous 429 stress assertion with account scope
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/stress-test.mjs')
          text = path.read_text()
          old = "  assert.equal(getTier1Model('iso-a', 'general-air').cooldownUntil > Date.now(), true, 'iso-a must be cooling');"
          new = "  assert.equal(getTier1Account('iso-a').accountCooldownUntil > Date.now(), true, 'iso-a account must be cooling');\n  assert.equal(getTier1Model('iso-a', 'general-air').cooldownUntil, 0, 'ambiguous 429 must not create model cooldown');"
          if old not in text:
              if new in text:
                  raise SystemExit(0)
              raise SystemExit('expected S9 assertion not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet -- tests/stress-test.mjs; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "4189821+github-actions[bot]@users.noreply.github.com"
          git add tests/stress-test.mjs
          git commit -m "test: align stress 429 assertion with account cooldown"
          git push origin HEAD:fix/stress-429-gate
