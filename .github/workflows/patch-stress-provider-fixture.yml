name: Patch stress provider fixture

on:
  push:
    branches: [fix/provider-capability-contract]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[stress-provider-fixture]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/provider-capability-contract

      - name: Remove retired wire fields from stress Node helper
        shell: python
        run: |
          from pathlib import Path
          p = Path('tests/stress-test.mjs')
          lines = p.read_text().splitlines()
          retired = ["  protocol: 'openai',", "  surfaces: ['chat_completions'],"]
          for line in retired:
              if lines.count(line) != 1:
                  raise SystemExit(f'expected exactly one {line!r}, found {lines.count(line)}')
              lines.remove(line)
          p.write_text('\n'.join(lines) + '\n')

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          git add tests/stress-test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "test: converge stress provider fixture [stress-provider-fixture]"
          git push origin HEAD:fix/provider-capability-contract
