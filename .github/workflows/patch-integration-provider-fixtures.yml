name: Patch integration provider fixtures

on:
  push:
    branches: [fix/provider-capability-contract]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[integration-provider-fixtures]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/provider-capability-contract

      - name: Converge integration fixtures to provider-owned wire capabilities
        shell: python
        run: |
          from pathlib import Path

          p = Path('tests/integration-test.mjs')
          s = p.read_text()

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              s = s.replace(old, new, 1)

          replace_once(
          """// Runs the real worker pipeline against mocked upstreams. Retired node limits,
          // node RPM buckets, and implicit protocol/surface defaults are intentionally
          // absent: strict schema rejection is the compatibility boundary.""",
          """// Runs the real worker pipeline against mocked upstreams. Retired node limits
          // stay rejected, while protocol/surface capabilities are derived from the Provider
          // profile rather than repeated in account-level Node JSON.""",
          'header contract')

          replace_once(
          """const openaiNode = (id, extra = {}) => ({
            id,
            provider: 'mock',
            protocol: 'openai',
            surfaces: ['chat_completions'],
            base_url: `https://${id}.example.com/v1`,
            models: { 'general-air': 'up-model' },
            ...extra,
          });""",
          """const openaiNode = (id, extra = {}) => ({
            id,
            provider: 'mock',
            base_url: `https://${id}.example.com/v1`,
            models: { 'general-air': 'up-model' },
            ...extra,
          });""",
          'openai helper')

          replace_once(
          """const anthropicNode = (id, extra = {}) => ({
            id,
            provider: 'mock',
            protocol: 'anthropic',
            surfaces: ['messages'],
            base_url: `https://${id}.example.com`,
            models: { 'general-air': 'up-model' },
            ...extra,
          });""",
          """const anthropicNode = (id, extra = {}) => ({
            id,
            provider: 'anthropic',
            base_url: `https://${id}.example.com`,
            models: { 'general-air': 'up-model' },
            ...extra,
          });""",
          'anthropic helper')

          replace_once(
          """const responsesNode = (id, extra = {}) => ({
            id,
            provider: 'mock',
            protocol: 'openai',
            surfaces: ['responses'],
            base_url: `https://${id}.example.com/v1`,
            models: { 'general-air': 'up-model' },
            ...extra,
          });""",
          """const responsesNode = (id, extra = {}) => ({
            id,
            provider: 'openai',
            base_url: `https://${id}.example.com/v1`,
            models: { 'general-air': 'up-model' },
            ...extra,
          });""",
          'responses helper')

          old_test = """await test('missing protocol/surfaces is a hard schema error and never reaches upstream', async () => {
            routeHandlers['implicit.example.com'] = () => jsonResponse(okChat('must-not-route'));
            const implicit = {
              id: 'implicit', provider: 'mock', base_url: 'https://implicit.example.com/v1',
              models: { 'general-air': 'up-model' },
            };
            const env = makeEnv({ tier1: [implicit], secrets: { implicit: 'k' } });
            const health = await worker.fetch(new Request('https://gateway.example.com/health', {
              headers: { authorization: `Bearer ${ACCESS_KEY}` },
            }), env, {});
            assert.equal(health.status, 503);
            const body = await health.json();
            assert.equal(body.status, 'invalid');
            assert.ok(body.diagnostics.some((d) => d.includes('protocol is required')));
            const res = await worker.fetch(chatRequest(), env, {});
            assert.equal(res.status, 404);
            assert.equal(upstreamCalls.length, 0);
          });"""
          new_test = """await test('protocol/surfaces in Node JSON are hard schema errors and never reach upstream', async () => {
            routeHandlers['retired-wire-fields.example.com'] = () => jsonResponse(okChat('must-not-route'));
            const invalid = {
              id: 'retired-wire-fields', provider: 'mock',
              protocol: 'openai', surfaces: ['chat_completions'],
              base_url: 'https://retired-wire-fields.example.com/v1',
              models: { 'general-air': 'up-model' },
            };
            const env = makeEnv({ tier1: [invalid], secrets: { 'retired-wire-fields': 'k' } });
            const health = await worker.fetch(new Request('https://gateway.example.com/health', {
              headers: { authorization: `Bearer ${ACCESS_KEY}` },
            }), env, {});
            assert.equal(health.status, 503);
            const body = await health.json();
            assert.equal(body.status, 'invalid');
            assert.ok(body.diagnostics.some((d) => d.includes('unknown field "protocol"')));
            assert.ok(body.diagnostics.some((d) => d.includes('unknown field "surfaces"')));
            const res = await worker.fetch(chatRequest(), env, {});
            assert.equal(res.status, 404);
            assert.equal(upstreamCalls.length, 0);
          });"""
          replace_once(old_test, new_test, 'retired wire-field contract')

          replace_once(
            "assert.deepEqual(model.api_backends.sort(), ['mock']);",
            "assert.deepEqual(model.api_backends.sort(), ['anthropic', 'mock']);",
            'model backend projection')

          replace_once(
            "await test('OpenAI Responses uses only a responses-capable native node', async () => {",
            "await test('OpenAI Responses uses the native OpenAI provider profile', async () => {",
            'responses test name')

          p.write_text(s)

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          git add tests/integration-test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "test: converge integration provider fixtures [integration-provider-fixtures]"
          git push origin HEAD:fix/provider-capability-contract
