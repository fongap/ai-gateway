name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify project
        run: npm run verify

      - name: Dry-run Worker bundle
        run: npm run check:deploy

      - name: Verify tag matches package version
        shell: bash
        run: |
          VERSION="$(node scripts/release-meta.mjs version)"
          test "${GITHUB_REF_NAME}" = "v${VERSION}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match package version v${VERSION}." >&2
            exit 1
          }

      - name: Build release archives
        run: ./scripts/build-release.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACT="$(node scripts/release-meta.mjs artifact)"
          TITLE="$(node scripts/release-meta.mjs name) ${GITHUB_REF_NAME}"
          gh release create "${GITHUB_REF_NAME}" \
            "release/${ARTIFACT}.zip" \
            "release/${ARTIFACT}.tar.gz" \
            release/SHA256SUMS \
            --title "${TITLE}" \
            --generate-notes
