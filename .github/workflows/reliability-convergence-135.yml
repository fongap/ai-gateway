name: Reliability Convergence 1.3.5

on:
  push:
    branches: [fix/reliability-convergence-1.3.5]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/reliability-convergence-1.3.5
          fetch-depth: 0

      - name: Apply deterministic repair
        run: python3 scripts/reliability-convergence-135.py

      - name: Remove one-time repair files
        run: |
          rm scripts/reliability-convergence-135.py
          rm .github/workflows/reliability-convergence-135.yml

      - name: Validate patch formatting
        run: git diff --check

      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: converge reliability semantics"
          git push origin HEAD:fix/reliability-convergence-1.3.5
