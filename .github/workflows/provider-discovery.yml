name: Provider Catalog Audit

# Manual audit of Provider catalog snapshots and Runtime-vs-Catalog consistency.
# This workflow is observation-only: it never mutates Runtime Node config,
# Model Registry config, Worker Variables, or Worker Secrets.
#
# What it does:
#   1. Reads previous/current catalog snapshots.
#   2. Normalizes snapshots and computes semantic changes.
#   3. Checks a sanitized Runtime view against the catalog.
#   4. Writes a report + JSON artifacts + Action Summary.
#
# It does NOT probe providers with generation requests and therefore should not
# be described as automatic Provider discovery.

on:
  workflow_dispatch:
    inputs:
      catalog_before:
        description: 'Path to previous catalog JSON (optional; defaults to scripts/provider-discovery/samples/catalog.example.json if missing)'
        required: false
        type: string
        default: ''
      catalog_after:
        description: 'Path to current catalog JSON (optional; defaults to scripts/provider-discovery/samples/catalog.example.json if missing)'
        required: false
        type: string
        default: ''
      runtime_view:
        description: 'Path to runtime view JSON (optional; defaults to scripts/provider-discovery/samples/runtime-view.example.json if missing)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: provider-catalog-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit snapshots and write report
        env:
          CATALOG_BEFORE: ${{ inputs.catalog_before }}
          CATALOG_AFTER: ${{ inputs.catalog_after }}
          RUNTIME_VIEW: ${{ inputs.runtime_view }}
        run: |
          BEFORE="${CATALOG_BEFORE:-scripts/provider-discovery/samples/catalog.example.json}"
          AFTER="${CATALOG_AFTER:-scripts/provider-discovery/samples/catalog.example.json}"
          RUNTIME="${RUNTIME_VIEW:-scripts/provider-discovery/samples/runtime-view.example.json}"
          mkdir -p "$RUNNER_TEMP/provider-catalog-audit"
          node scripts/provider-discovery.mjs check-snapshot "$AFTER"
          node scripts/provider-discovery.mjs diff "$BEFORE" "$AFTER" \
            --out "$RUNNER_TEMP/provider-catalog-audit/changes.md" \
            --json-out "$RUNNER_TEMP/provider-catalog-audit/changes.json"
          node scripts/provider-discovery.mjs runtime-check "$AFTER" "$RUNTIME" \
            --json-out "$RUNNER_TEMP/provider-catalog-audit/runtime-warnings.json" || true
          node scripts/provider-discovery.mjs summary "$AFTER" \
            > "$RUNNER_TEMP/provider-catalog-audit/summary.txt"
          cat "$RUNNER_TEMP/provider-catalog-audit/summary.txt" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload audit artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: provider-catalog-audit
          path: ${{ runner.temp }}/provider-catalog-audit/
          if-no-files-found: warn
          retention-days: 14
