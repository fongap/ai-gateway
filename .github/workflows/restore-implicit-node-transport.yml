name: Restore Implicit Node Transport

on:
  push:
    branches: [fix/restore-implicit-node-transport]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/restore-implicit-node-transport
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply compatibility repair
        run: python3 scripts/restore-implicit-node-transport.py

      - name: Targeted verification
        run: |
          node tests/gateway-configuration-test.mjs
          node tests/protocol-matrix-test.mjs
          node tests/integration-test.mjs
          npm run typecheck

      - name: Remove one-time repair files
        run: |
          rm scripts/restore-implicit-node-transport.py
          rm .github/workflows/restore-implicit-node-transport.yml

      - name: Validate diff
        run: git diff --check

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve implicit node transport defaults"
          git push origin HEAD:fix/restore-implicit-node-transport
